<div class="page">
  <div class="auth-card">
    <h2>Sign up</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>Email
        <input type="email" formControlName="email" />
      </label>
      <div *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
        <small *ngIf="form.get('email')?.errors?.['required']">Field required.</small>
        <small *ngIf="form.get('email')?.errors?.['email']">Email not valid.</small>
      </div>

      <label>First name
        <input type="text" formControlName="firstName" />
      </label>
      <div *ngIf="form.get('firstName')?.touched && form.get('firstName')?.invalid">
        <small>Field required.</small>
      </div>

      <label>Last name
        <input type="text" formControlName="lastName" />
      </label>
      <div *ngIf="form.get('lastName')?.touched && form.get('lastName')?.invalid">
        <small>Field required.</small>
      </div>

      <label>Organization
        <input type="text" formControlName="organization" />
      </label>
      <div *ngIf="form.get('organization')?.touched && form.get('organization')?.invalid">
        <small>Field required.</small>
      </div>

      <!-- LOZINKA -->
      <label>Password
        <div class="pw-input">
          <input
            [type]="showPw ? 'text' : 'password'"
            formControlName="password"
            autocomplete="new-password"
            (input)="onPasswordInput()"
          />
          <button type="button" class="toggle" (click)="showPw = !showPw">
            {{ showPw ? 'Hide' : 'Show' }}
          </button>
        </div>
      </label>
      <div *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
        <small *ngIf="form.get('password')?.errors?.['required']">Field required.</small>
        <small *ngIf="form.get('password')?.errors?.['minlength']">Minimum 12 characters.</small>
      </div>

      <!-- METER ZA JAČINU -->
      <div class="meter">
        <ng-container *ngFor="let i of [0,1,2,3,4]">
          <span class="seg" [class.active]="strength >= i"></span>
        </ng-container>
        <span class="label">{{ strengthLabel }}</span>
      </div>

      <ul class="tips" *ngIf="tips.length">
        <li *ngFor="let t of tips">{{ t }}</li>
      </ul>

      <!-- POTVRDA LOZINKE -->
      <label>Confirm password
        <div class="pw-input">
          <input
            [type]="showConfirm ? 'text' : 'password'"
            formControlName="confirmPassword"
            autocomplete="new-password"
          />
          <button type="button" class="toggle" (click)="showConfirm = !showConfirm">
            {{ showConfirm ? 'Hide' : 'Show' }}
          </button>
        </div>
      </label>
      <div *ngIf="form.touched && form.errors?.['passwordMismatch']">
        <small>Passwords don't match.</small>
      </div>

      <button type="submit" [disabled]="submitting || form.invalid || strength < 2 || form.errors?.['passwordMismatch']">Register</button>
      
    </form>
    <p class="muted">
        Already have an account?
        <a routerLink="/login">Sing in</a>
    </p>

    <p *ngIf="successMsg" class="msg success">{{ successMsg }}</p>
    <p *ngIf="errorMsg" class="msg error">{{ errorMsg }}</p>
  </div>
</div>
