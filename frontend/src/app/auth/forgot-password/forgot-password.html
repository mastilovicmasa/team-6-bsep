<div class="page">
  <div class="auth-card">
    <h2>Forgot Password</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Email
        <input type="email" formControlName="email" />
      </label>
      <div *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
        <small *ngIf="form.get('email')?.errors?.['required']">Field required.</small>
        <small *ngIf="form.get('email')?.errors?.['email']">Invalid email.</small>
      </div>

      <button type="submit" [disabled]="submitting || form.invalid">Send reset link</button>
    </form>

    <p *ngIf="msg" class="msg">{{ msg }}</p>
  </div>
</div>
