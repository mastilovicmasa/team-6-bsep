<div class="container mt-4" *ngIf="entry">
  <h3>Password details</h3>

  <div class="card p-3 mt-3">
    <p><strong>Site:</strong> {{ entry.siteName }}</p>
    <p><strong>Username:</strong> {{ entry.username }}</p>
    <p><strong>Created at:</strong> {{ entry.createdAt | date: 'short' }}</p>
  </div>

  <div class="mt-4">
    <label for="privateKey" class="form-label">Upload your private key (.pem)</label>
    <input id="privateKey" type="file" class="form-control" (change)="onPrivateKeySelected($event)">
  </div>

  <div class="mt-3">
    <button class="btn btn-primary me-2" (click)="decryptPassword()">Decrypt</button>
    <button class="btn btn-secondary" *ngIf="showPassword" (click)="hidePassword()">Hide</button>
  </div>

  <div *ngIf="showPassword" class="alert alert-info mt-3">
    <strong>Decrypted password:</strong> {{ decryptedPassword }}
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>

  <!-- <div class="mt-4">
    <h5>Shared with:</h5>
    <ul *ngIf="entry.shares && entry.shares.length > 0; else noShares">
      <li *ngFor="let s of entry.shares">
        User ID: {{ s.userId }} | Shared at: {{ s.sharedAt | date: 'short' }}
      </li>
    </ul>
    <ng-template #noShares>
      <p class="text-muted">This password is not shared with anyone.</p>
    </ng-template>
  </div> -->

  <div class="mt-4">
    <button class="btn btn-outline-success" [routerLink]="['/passwords', entry.id, 'share']">
      Share with another user
    </button>
  </div>
</div>

<div *ngIf="isLoading" class="text-muted mt-4">Loading...</div>
