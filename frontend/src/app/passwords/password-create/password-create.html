<div class="container mt-4">
  <h3>Add new password</h3>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="siteName" class="form-label">Site name</label>
      <input id="siteName" formControlName="siteName" class="form-control" placeholder="e.g. Gmail">
    </div>

    <div class="mb-3">
      <label for="username" class="form-label">Username on that site</label>
      <input id="username" formControlName="username" class="form-control" placeholder="e.g. alice2000">
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input id="password" type="password" formControlName="password" class="form-control">
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="isSaving">Save</button>
  </form>

  <div *ngIf="successMessage" class="alert alert-success mt-3">
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>
</div>
