<div class="panel">
  <h2>View Shared Password</h2>

  <div class="info">
    <div><strong>Site:</strong> {{ siteName }}</div>
    <div><strong>Username:</strong> {{ username }}</div>
  </div>

  <div>
    <label>Upload your private key (.pem)</label>
    <input type="file" (change)="onPrivateKeySelected($event)" />
  </div>

  <div class="actions">
    <button (click)="decryptPassword()" [disabled]="isProcessing">Decrypt</button>
    <button *ngIf="showPassword" class="btn-secondary" (click)="hidePassword()">Hide</button>
  </div>

  <div *ngIf="showPassword" class="success mt-3">
    <strong>Password:</strong> {{ decryptedPassword }}
  </div>

  <div *ngIf="errorMessage" class="error mt-3">
    {{ errorMessage }}
  </div>
</div>
