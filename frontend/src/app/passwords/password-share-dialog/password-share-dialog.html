<div class="panel">
  <h2>Share Password</h2>

  <div *ngIf="entry" class="info">
    <div><strong>Site:</strong> {{ entry.siteName }}</div>
    <div><strong>Username:</strong> {{ entry.username }}</div>
  </div>

  <form (ngSubmit)="sharePassword()">
    <div>
      <label>Recipient Email</label>
      <input
        type="email"
        [(ngModel)]="targetEmail"
        name="targetEmail"
        placeholder="user@example.com"
        required
      />
    </div>

    <div>
      <label>Upload Your Private Key (.pem)</label>
      <input type="file" (change)="onPrivateKeySelected($event)" required />
    </div>

    <button type="submit" [disabled]="isProcessing">
      {{ isProcessing ? 'Sharing...' : 'Share Password' }}
    </button>
  </form>

  <div *ngIf="successMessage" class="success">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
</div>
