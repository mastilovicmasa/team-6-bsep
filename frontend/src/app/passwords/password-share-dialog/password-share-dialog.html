<div class="container mt-4">
  <h4>Share password</h4>

  <div *ngIf="entry" class="alert alert-secondary">
    <strong>Site:</strong> {{ entry.siteName }}<br>
    <strong>Username:</strong> {{ entry.username }}
  </div>

  <div class="mb-3">
    <label class="form-label">Recipient email</label>
    <input type="text" [(ngModel)]="targetEmail" class="form-control" placeholder="Enter user email">
  </div>

  <div class="mb-3">
    <label class="form-label">Upload your private key (.pem)</label>
    <input type="file" class="form-control" (change)="onPrivateKeySelected($event)">
  </div>

  <button class="btn btn-primary" (click)="sharePassword()" [disabled]="isProcessing">
    Share password
  </button>

  <div *ngIf="successMessage" class="alert alert-success mt-3">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger mt-3">
    {{ errorMessage }}
  </div>
</div>
