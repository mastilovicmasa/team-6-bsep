<div class="max-w-md mx-auto bg-white shadow p-6 rounded-lg">
  <h2 class="text-xl font-semibold mb-4">Add Subordinate CA User</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block mb-1 font-medium">Email</label>
      <input type="email" formControlName="email" class="w-full border rounded p-2" />
    </div>

    <div>
      <label class="block mb-1 font-medium">First Name</label>
      <input type="text" formControlName="firstName" class="w-full border rounded p-2" />
    </div>

    <div>
      <label class="block mb-1 font-medium">Last Name</label>
      <input type="text" formControlName="lastName" class="w-full border rounded p-2" />
    </div>

    <div>
      <label class="block mb-1 font-medium">Organization</label>
      <input type="text" formControlName="organization" class="w-full border rounded p-2" />
    </div>

    <button type="submit" class="w-full bg-blue-600 text-white rounded py-2 hover:bg-blue-700">
      Create Subordinate CA
    </button>
  </form>
</div>
